<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Devil's Advocate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span class="logo-mark">DA</span>
            <span>DEVIL'S ADVOCATE</span>
        </div>

        <a href="{{ url_for('login') }}" class="back-home">
            ← Login
        </a>

    </header>

    <main class="login-section">

        <div class="login-intro">

            <p class="small-label">RESET PASSWORD</p>

            <h1>
                Forgot your<br>
                <span>password?</span>
            </h1>

            <p class="intro-text">
                Enter your registered email and create a new password.
            </p>

        </div>

        <div class="login-card">

            <div class="card-top">

                <p class="card-label">DEVIL'S ADVOCATE</p>

                <h2>Reset password</h2>

                <p class="card-description">
                    Enter your details below.
                </p>

            </div>

            <form method="POST" action="/forgot-password">

                <div class="input-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required>
                </div>

                <div class="input-group">
                    <label for="password">New password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required>
                </div>

                <button type="submit" class="login-button">
                    Change Password →
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>© 2026 Devil's Advocate · AI-powered business idea evaluation</p>
    </footer>

</body>

</html>
