<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | Devil's Advocate</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 48%,
                rgba(133, 91, 37, 0.15), transparent 43%),
                #11100f;
            color: #f5eee0;
            font-family: 'DM Sans', Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative gold background curves */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 390px;
            height: 390px;
            border-radius: 48% 52% 65% 35%;
            background: linear-gradient(
                135deg,
                rgba(157, 112, 48, 0.19),
                rgba(55, 40, 24, 0.04)
            );
            border: 1px solid rgba(214, 169, 91, 0.35);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: -255px;
            left: -165px;
            transform: rotate(-25deg);
        }

        body::after {
            bottom: -280px;
            right: -160px;
            transform: rotate(25deg);
        }

        nav {
            height: 88px;
            padding: 0 5%;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: relative;
            z-index: 1;
            background: rgba(12, 12, 12, 0.3);
        }

        .logo {
            color: #e8c477;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 31px;
            border: 1px solid #cba45e;
            padding: 5px 9px;
        }

        .brand {
            border-left: 1px solid #9c7a43;
            padding-left: 20px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        main {
            min-height: calc(100vh - 88px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 55px 20px 80px;
            position: relative;
            z-index: 1;
        }

        .success-content {
            width: 100%;
            max-width: 850px;
            animation: appear 0.8s ease-out;
        }

        .check-icon {
            width: 112px;
            height: 112px;
            margin: 0 auto 35px;
            border: 4px solid #e4bd70;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e4bd70;
            font-size: 65px;
            font-weight: 400;
            box-shadow: 0 0 45px rgba(222, 177, 97, 0.13);
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(34px, 5vw, 59px);
            line-height: 1.25;
            font-weight: 600;
            color: #f2dfb9;
            margin-bottom: 27px;
        }

        .celebration {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.75em;
        }

        .message {
            color: #e4e0db;
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 38px;
        }

        .login-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-width: 318px;
            padding: 20px 32px;
            background: linear-gradient(110deg, #e7bd70, #f5d99d);
            color: #17130d;
            text-decoration: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 0 32px rgba(221, 174, 91, 0.15);
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 38px rgba(221, 174, 91, 0.3);
        }

        .footer {
            margin: 75px auto 0;
            color: #b18a4e;
            font-size: 12px;
            letter-spacing: 4px;
        }

        .footer::before {
            content: "✦";
            display: block;
            font-size: 25px;
            margin-bottom: 13px;
            color: #e4bd70;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            nav {
                height: 72px;
                padding: 0 18px;
                gap: 12px;
            }

            .logo {
                font-size: 24px;
            }

            .brand {
                font-size: 11px;
                letter-spacing: 2px;
                padding-left: 12px;
            }

            main {
                min-height: calc(100vh - 72px);
                padding: 45px 18px;
            }

            .check-icon {
                width: 90px;
                height: 90px;
                font-size: 52px;
                margin-bottom: 28px;
            }

            .message {
                font-size: 16px;
            }

            .login-button {
                min-width: 0;
                width: 100%;
                max-width: 318px;
            }

            .footer {
                margin-top: 58px;
                font-size: 10px;
                letter-spacing: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .success-content {
                animation: none;
            }

            .login-button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">DA</div>
        <div class="brand">DEVIL'S ADVOCATE</div>
    </nav>

    <main>
        <section class="success-content">
            <div class="check-icon" aria-label="Success">✓</div>

            <h1>
                Registration Successful!
                <span class="celebration">🎉</span>
            </h1>

            <p class="message">
                Your account has been created successfully. 😊
            </p>

            <a href="{{ url_for('login') }}" class="login-button">
                Continue to Login <span>→</span>
            </a>

            <div class="footer">
                THINK DEEPER. QUESTION EVERYTHING.
            </div>
        </section>
    </main>
</body>
</html>
